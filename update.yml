name: Update Excel Data

on:
  schedule:
    # Запуск два раза в неделю (например, каждый понедельник и четверг в 8:00 UTC)
    - cron: '0 8 * * 1,4'
  workflow_dispatch: # Позволяет запускать обновление вручную кнопкой на сайте GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даем права скрипту на сохранение изменений в репозиторий
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install xlsx

      - name: Run parser script
        run: node parse.js

      - name: Commit and push if data changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Excel data [skip ci]" && git push)
