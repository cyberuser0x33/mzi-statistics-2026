<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Актуальные данные из расписания</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f9f9f9; color: #333; }
        table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Данные из университетской таблицы</h1>
    <p>Информация автоматически обновляется несколько раз в неделю.</p>

    <div id="table-container">Загрузка данных...</div>

    <script>
        async function renderTable() {
            try {
                // Загружаем сгенерированный JSON-файл прямо из корня сайта
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Не удалось загрузить данные');

                const data = await response.json();

                if (data.length === 0) {
                    document.getElementById('table-container').innerText = 'Таблица пуста.';
                    return;
                }

                // Создаем HTML-таблицу на основе полученных ключей объекта
                let html = '<table><thead><tr>';
                const headers = Object.keys(data[0]);

                headers.forEach(h => {
                    html += <th>${h}</th>;
                });
                html += '</tr></thead><tbody>';

                data.forEach(row => {
                    html += '<tr>';
                    headers.forEach(h => {
                        html += <td>${row[h] !== undefined ? row[h] : ''}</td>;
                    });
                    html += '</tr>';
                });

                html += '</tbody></table>';
                document.getElementById('table-container').innerHTML = html;

            } catch (error) {
                document.getElementById('table-container').innerText = 'Ошибка при загрузке данных: ' + error.message;
                console.error(error);
            }
        }

        renderTable();
    </script>

</body>
</html>
