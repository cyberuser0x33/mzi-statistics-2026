<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-labelledby="title desc">
  <title id="title">Медаль за третье место</title>
  <desc id="desc">Золотая медаль с зелёным центром, лавровым венком и цифрой 3.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2a0"/><stop offset=".25" stop-color="#f5c83d"/><stop offset=".55" stop-color="#b97913"/><stop offset=".78" stop-color="#ffe777"/><stop offset="1" stop-color="#c58a19"/></linearGradient>
    <linearGradient id="goldLight" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff7b9"/><stop offset=".45" stop-color="#ffdc54"/><stop offset="1" stop-color="#d89518"/></linearGradient>
    <radialGradient id="green" cx="35%" cy="25%" r="85%"><stop stop-color="#18b98a"/><stop offset=".65" stop-color="#07845f"/><stop offset="1" stop-color="#006347"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#51350a" flood-opacity=".35"/></filter>
    <g id="leaf"><path d="M0 0 C-10 -5 -12 -17 0 -23 C10 -15 9 -5 0 0Z" fill="url(#goldLight)" stroke="#9b6814" stroke-width="1.2"/></g>
  </defs>
  <!-- hanging loop -->
  <path d="M119 62 C120 36 127 14 150 14 C173 14 180 36 181 62 L197 78 L103 78Z" fill="url(#gold)" stroke="#8b5a0d" stroke-width="2"/>
  <circle cx="150" cy="43" r="13" fill="#101010" stroke="#ffe98a" stroke-width="3"/>
  <!-- medal body -->
  <circle cx="150" cy="190" r="137" fill="url(#gold)" stroke="#8b5b11" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="150" cy="190" r="127" fill="#e8b72e" stroke="#fff0a0" stroke-width="2"/>
  <circle cx="150" cy="190" r="120" fill="none" stroke="#9c6816" stroke-width="2"/>
  <circle cx="150" cy="190" r="114" fill="none" stroke="#ffe78a" stroke-width="3"/>
  <!-- simple ornamental dots around rim -->
  <g fill="#fff0a0" stroke="#a66c13" stroke-width=".7">
    <circle cx="150" cy="75" r="2.5"/><circle cx="180" cy="79" r="2.5"/><circle cx="208" cy="91" r="2.5"/><circle cx="232" cy="111" r="2.5"/><circle cx="250" cy="137" r="2.5"/><circle cx="263" cy="166" r="2.5"/><circle cx="265" cy="197" r="2.5"/><circle cx="257" cy="228" r="2.5"/><circle cx="241" cy="255" r="2.5"/><circle cx="218" cy="277" r="2.5"/><circle cx="189" cy="291" r="2.5"/><circle cx="158" cy="304" r="2.5"/>
    <circle cx="120" cy="79" r="2.5"/><circle cx="92" cy="91" r="2.5"/><circle cx="68" cy="111" r="2.5"/><circle cx="50" cy="137" r="2.5"/><circle cx="37" cy="166" r="2.5"/><circle cx="35" cy="197" r="2.5"/><circle cx="43" cy="228" r="2.5"/><circle cx="59" cy="255" r="2.5"/><circle cx="82" cy="277" r="2.5"/><circle cx="111" cy="291" r="2.5"/><circle cx="142" cy="304" r="2.5"/>
  </g>
  <!-- laurel branches -->
  <g fill="none" stroke="#9b6815" stroke-width="2.2" stroke-linecap="round"><path d="M76 257 C52 220 54 168 88 128 C102 112 116 103 129 98"/><path d="M224 257 C248 220 246 168 212 128 C198 112 184 103 171 98"/></g>
  <g filter="url(#shadow)">
    <use href="#leaf" transform="translate(72 239) rotate(-44)"/><use href="#leaf" transform="translate(64 216) rotate(-57)"/><use href="#leaf" transform="translate(65 191) rotate(-72)"/><use href="#leaf" transform="translate(72 167) rotate(-78)"/><use href="#leaf" transform="translate(84 146) rotate(-52)"/><use href="#leaf" transform="translate(100 127) rotate(-43)"/><use href="#leaf" transform="translate(117 111) rotate(-34)"/>
    <use href="#leaf" transform="translate(228 239) rotate(44)"/><use href="#leaf" transform="translate(236 216) rotate(57)"/><use href="#leaf" transform="translate(235 191) rotate(72)"/><use href="#leaf" transform="translate(228 167) rotate(78)"/><use href="#leaf" transform="translate(216 146) rotate(52)"/><use href="#leaf" transform="translate(200 127) rotate(43)"/><use href="#leaf" transform="translate(183 111) rotate(34)"/>
    <use href="#leaf" transform="translate(95 265) rotate(-65) scale(.8)"/><use href="#leaf" transform="translate(115 278) rotate(-75) scale(.75)"/><use href="#leaf" transform="translate(135 284) rotate(-85) scale(.65)"/>
    <use href="#leaf" transform="translate(205 265) rotate(65) scale(.8)"/><use href="#leaf" transform="translate(185 278) rotate(75) scale(.75)"/><use href="#leaf" transform="translate(165 284) rotate(85) scale(.65)"/>
  </g>
  <!-- green center medallion -->
  <circle cx="150" cy="190" r="76" fill="url(#green)" stroke="#ffe36b" stroke-width="4"/>
  <circle cx="150" cy="190" r="68" fill="none" stroke="#7ce0ad" stroke-opacity=".75" stroke-width="1.5"/>
  <text x="150" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="800" fill="url(#goldLight)" stroke="#80530d" stroke-width="4" paint-order="stroke fill">3</text>
  <text x="150" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="800" fill="url(#goldLight)" stroke="#fff0a0" stroke-width="1.2" paint-order="stroke fill">3</text>
  <g fill="#fffef0"><path d="M82 171 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3Z"/><path d="M218 176 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5Z"/><path d="M93 230 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2Z"/><path d="M208 229 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2Z"/></g>
</svg>
